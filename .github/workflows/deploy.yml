name: Deploy production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: self-hosted
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      MARIADB_APP_PASSWORD: ${{ secrets.MARIADB_APP_PASSWORD }}
      MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"
          : "${APP_ENV_FILE:?Missing APP_ENV_FILE secret}"
          : "${MARIADB_APP_PASSWORD:?Missing MARIADB_APP_PASSWORD secret}"
          : "${MARIADB_ROOT_PASSWORD:?Missing MARIADB_ROOT_PASSWORD secret}"

      - name: Check server tools
        shell: bash
        run: |
          set -euo pipefail
          command -v rsync >/dev/null
          command -v docker >/dev/null
          docker compose version
          docker info >/dev/null

      - name: Sync project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.mariadb_password' \
            --exclude='.mariadb_root_password' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='public/build/' \
            --exclude='storage/logs/*.log' \
            ./ "$DEPLOY_PATH/"

      - name: Write production secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$APP_ENV_FILE" > "$DEPLOY_PATH/.env"
          printf '%s\n' "$MARIADB_APP_PASSWORD" > "$DEPLOY_PATH/.mariadb_password"
          printf '%s\n' "$MARIADB_ROOT_PASSWORD" > "$DEPLOY_PATH/.mariadb_root_password"
          chmod 600 "$DEPLOY_PATH/.env" "$DEPLOY_PATH/.mariadb_root_password"
          chmod 644 "$DEPLOY_PATH/.mariadb_password"

      - name: Deploy containers
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"

          docker compose -f docker-compose-prod.yml build app nginx
          docker compose -f docker-compose-prod.yml up -d --remove-orphans

          docker compose -f docker-compose-prod.yml exec -T app sh -lc 'export DB_PASSWORD="$(cat /run/secrets/mariadb_app_password)" && php artisan optimize:clear'
          docker compose -f docker-compose-prod.yml exec -T app sh -lc 'export DB_PASSWORD="$(cat /run/secrets/mariadb_app_password)" && php artisan migrate --force'
          docker compose -f docker-compose-prod.yml exec -T app sh -lc 'export DB_PASSWORD="$(cat /run/secrets/mariadb_app_password)" && php artisan storage:link --force'
          docker compose -f docker-compose-prod.yml exec -T app sh -lc 'export DB_PASSWORD="$(cat /run/secrets/mariadb_app_password)" && php artisan optimize'

          docker image prune -f
