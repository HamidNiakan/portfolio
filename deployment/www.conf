[www]
user = www-data
group = www-data

; unix socket بهتره اما اگر با nginx روی TCP هستی، 9000 اوکیه
listen = 9000
; listen = /run/php-fpm.sock
; listen.mode = 0660
; listen.owner = www-data
; listen.group = www-data

pm = dynamic
pm.max_children = 40
pm.start_servers = 6
pm.min_spare_servers = 6
pm.max_spare_servers = 12
pm.max_requests = 500

; فوروارد خروجی‌ها به docker logs
catch_workers_output = yes

pm.status_path = /fpm-status
request_terminate_timeout = 120s
request_slowlog_timeout = 5s

; ⚠️ به‌جای فایل، slowlog را بفرست به stderr داکر
slowlog = /proc/self/fd/2
